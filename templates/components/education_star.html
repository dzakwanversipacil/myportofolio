<form method="post"
      action="{% url 'main:toggle_star' education.id %}"
      class="love-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-love{% if user in education.starred_by.all %} is-starred{% endif %}"
            title="{% if education.starred_by.all %}Starred by {{ education.starred_by.all|join:', ' }}{% else %}Be the first to star this!{% endif %}">
        <span aria-hidden="true">⭐</span>
        {% if user in education.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="love-count">{{ education.starred_by.count }}</span>
    </button>
</form>
